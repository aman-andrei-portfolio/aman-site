<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Creează-ți site-ul · Aman</title>
<meta name="description" content="Fă-ți singur site-ul pentru frizerie, cafenea, salon sau portofoliu, în câteva minute. Îl vezi live și îl descarci după plată."/>
<link rel="canonical" href="https://costi1andrei.site/editor.html"/>
<link rel="icon" href="/favicon.ico" sizes="48x48"/>
<link rel="icon" href="/assets/img/logo/favicon.svg" type="image/svg+xml"/>
<link rel="preload" href="/assets/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin/>
<style>
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/fonts/inter-latin-ext.woff2) format("woff2");unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C4,U+2113,U+2C60-2C7F,U+A720-A7FF}
@font-face{font-family:"Inter";font-style:normal;font-weight:400 700;font-display:swap;src:url(/assets/fonts/inter-latin.woff2) format("woff2");unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
/* Layout: panou de editare în stânga, previzualizare live în dreapta; pe telefon, două tab-uri. */
:root{--bg:#fff;--bg-2:#f5f5f7;--fg:#1d1d1f;--fg-2:#6e6e73;--line:#d2d2d7;--blue:#0071e3;--link:#0066cc;--sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter","Helvetica Neue",Arial,sans-serif;color-scheme:light}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg-2);color:var(--fg);font:400 15px/1.45 var(--sans);letter-spacing:-.01em;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
a{color:var(--link);text-decoration:none}a:hover{text-decoration:underline}
button,input,textarea,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}
.top{flex:none;display:flex;align-items:center;justify-content:space-between;gap:12px;height:56px;padding:0 max(16px,env(safe-area-inset-left,0px));background:rgba(255,255,255,.86);backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);border-bottom:1px solid rgba(0,0,0,.08)}
.brand{font-size:19px;font-weight:600;letter-spacing:-.03em;color:var(--fg)}.brand:hover{text-decoration:none}
.top .mid{font-size:13px;color:var(--fg-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .right{display:flex;align-items:center;gap:10px}
.saved{font-size:12px;color:var(--fg-2)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;background:var(--blue);color:#fff;border:0;border-radius:980px;padding:9px 18px;font-weight:500;cursor:pointer;transition:background .2s,transform .15s;white-space:nowrap}
.btn:hover{background:#0077ed;text-decoration:none}.btn:active{transform:scale(.97)}.btn[disabled]{opacity:.45;cursor:default}
.btn.ghost{background:none;color:var(--link);box-shadow:inset 0 0 0 1px var(--link)}.btn.ghost:hover{background:rgba(0,102,204,.06)}
.btn.sm{padding:6px 12px;font-size:13px}
.plain{background:none;border:0;color:var(--link);cursor:pointer;padding:0}
.danger{color:#c4001a}
.app{flex:1;min-height:0;display:grid;grid-template-columns:420px minmax(0,1fr)}
.panel{background:var(--bg);border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0;min-width:0}
.stage{min-width:0}
.steps{flex:none;display:flex;gap:4px;padding:12px 14px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.steps::-webkit-scrollbar{display:none}
.steps button{flex:none;display:flex;align-items:center;gap:6px;border:0;background:none;border-radius:980px;padding:7px 11px;cursor:pointer;color:var(--fg-2);font-weight:500;font-size:13px}
.steps button b{display:grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--bg-2);color:var(--fg-2);font-size:11px}
.steps button[aria-selected="true"]{background:var(--fg);color:#fff}.steps button[aria-selected="true"] b{background:#fff;color:var(--fg)}
.body{flex:1;min-height:0;overflow-y:auto;padding:20px 22px 28px}
.body h2{font-size:22px;letter-spacing:-.025em;margin:0 0 4px}
.body .sub{color:var(--fg-2);margin:0 0 18px}
.foot{flex:none;display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 22px;border-top:1px solid var(--line);background:var(--bg)}
label.f{display:block;font-size:12px;font-weight:600;color:var(--fg-2);margin:14px 0 5px}
input[type=text],input[type=tel],input[type=email],textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 11px;font-size:16px}
textarea{resize:vertical;min-height:84px}
input:focus,textarea:focus{outline:2px solid var(--blue);outline-offset:0;border-color:transparent}
.count{float:right;font-weight:400}
.tpls{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.tpl{position:relative;text-align:left;border:1.5px solid var(--line);background:var(--bg);border-radius:14px;padding:12px;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.tpl[aria-pressed="true"]{border-color:var(--blue);box-shadow:0 0 0 3px rgba(0,113,227,.15)}
.tpl .sw{height:56px;border-radius:9px;display:flex;align-items:flex-end;padding:8px;font-weight:700;font-size:13px}
.tpl strong{font-size:14px}.tpl small{color:var(--fg-2);font-size:12px;line-height:1.35}
.swatches{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.swatches button{width:30px;height:30px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px var(--line);cursor:pointer}
.swatches button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}
.swatches input[type=color]{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.seg{display:inline-flex;padding:3px;background:#e8e8ed;border-radius:980px}
.seg button{border:0;background:none;border-radius:980px;padding:6px 14px;cursor:pointer;font-weight:500;font-size:13px}
.seg button[aria-pressed="true"]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.items{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.items li{background:var(--bg-2);border-radius:12px;padding:10px;display:grid;grid-template-columns:minmax(0,1fr) 108px;gap:6px}
.items li input{font-size:15px;padding:7px 9px}
.items li .d{grid-column:1/-1}
.items li .ctl{grid-column:1/-1;display:flex;gap:14px;font-size:13px}
.hours{display:grid;grid-template-columns:90px minmax(0,1fr);gap:6px 10px;align-items:center}
.hours span{font-size:14px}
.hours input{font-size:15px;padding:7px 9px}
.slot{display:flex;align-items:center;gap:12px;background:var(--bg-2);border-radius:12px;padding:10px;margin-top:6px}
.slot img{width:56px;height:56px;border-radius:10px;object-fit:cover;background:#ddd;flex:none}
.slot .ph{width:56px;height:56px;border-radius:10px;background:#e8e8ed;display:grid;place-items:center;color:var(--fg-2);font-size:22px;flex:none}
.slot .t{flex:1;min-width:0;font-size:14px}
.slot .t small{display:block;color:var(--fg-2);font-size:12px}
.up{position:relative;overflow:hidden}
.up input{position:absolute;inset:0;opacity:0;cursor:pointer}
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.gal figure{position:relative;margin:0}
.gal img{width:100%;aspect-ratio:1/1;object-fit:cover;border-radius:10px;display:block}
.gal button{position:absolute;top:4px;right:4px;width:24px;height:24px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;line-height:1}
.gal .add{aspect-ratio:1/1;border:1.5px dashed var(--line);border-radius:10px;display:grid;place-items:center;color:var(--link);font-size:13px;font-weight:500;cursor:pointer;position:relative}
.gal .add input{position:absolute;inset:0;opacity:0;cursor:pointer}
.note{background:var(--bg-2);border-radius:12px;padding:12px 14px;font-size:14px;color:var(--fg-2)}
.note.warn{background:#fff4e5;color:#7a4100}
.note.ok{background:#e9f7ee;color:#0d5c2a}
.err{color:#c4001a;font-size:13px;margin:8px 0 0}
fieldset.lock{border:0;margin:0;padding:0;min-width:0;opacity:.55}
.lockbar{margin-bottom:16px}
.code{font-size:34px;font-weight:700;letter-spacing:.02em;font-variant-numeric:tabular-nums;margin:6px 0}
.msg{width:100%;background:var(--bg-2);border:0;border-radius:10px;padding:10px 12px;resize:none;font-size:15px}
.price{font-size:30px;font-weight:700;letter-spacing:-.03em}
.list{margin:10px 0 0;padding-left:20px;color:var(--fg-2)}
.list li{margin:3px 0}
.stage{min-height:0;display:flex;flex-direction:column;align-items:center;padding:14px}
.stage .bar{flex:none;display:flex;gap:10px;align-items:center;margin-bottom:12px}
.frame{flex:1;min-height:0;width:100%;display:flex;justify-content:center}
.frame iframe{width:100%;height:100%;border:0;background:#fff;border-radius:14px;box-shadow:0 10px 40px -10px rgba(0,0,0,.25);transition:width .3s}
.frame.phone iframe{width:390px;max-width:100%;border-radius:28px}
.mtabs{display:none}
@media(max-width:860px){
  .top .mid{display:none}
  .app{grid-template-columns:minmax(0,1fr)}
  .mtabs{display:flex;justify-content:center;padding:8px;background:var(--bg);border-bottom:1px solid var(--line)}
  .app[data-tab="edit"] .stage{display:none}
  .app[data-tab="preview"] .panel{display:none}
  .stage .bar .seg{display:none}
  .frame iframe,.frame.phone iframe{width:100%;border-radius:12px}
  .stage{padding:8px}
}
</style>
</head>
<body>
<header class="top">
  <a class="brand" href="/">Aman</a>
  <span class="mid">Editor de site-uri</span>
  <div class="right"><span class="saved" id="saved" aria-live="polite"></span><a class="btn sm ghost" href="/#cont" id="acc">Contul meu</a></div>
</header>
<div class="mtabs"><div class="seg" role="tablist"><button type="button" data-mtab="edit" aria-pressed="true">Editează</button><button type="button" data-mtab="preview" aria-pressed="false">Previzualizare</button></div></div>
<main class="app" id="app" data-tab="edit">
  <section class="panel" aria-label="Editare">
    <nav class="steps" id="steps" role="tablist" aria-label="Pași"></nav>
    <div class="body" id="body"></div>
    <div class="foot"><button type="button" class="plain" id="prev">‹ Înapoi</button><button type="button" class="btn" id="next">Continuă</button></div>
  </section>
  <section class="stage" aria-label="Previzualizare">
    <div class="bar"><div class="seg" id="device"><button type="button" data-dev="phone" aria-pressed="true">Telefon</button><button type="button" data-dev="desktop" aria-pressed="false">Calculator</button></div></div>
    <div class="frame phone" id="frame"><iframe id="pv" title="Previzualizarea site-ului" sandbox=""></iframe></div>
  </section>
</main>
<script src="/assets/js/site-templates.js"></script>
<script src="/assets/js/editor.js"></script>
</body>
</html>
