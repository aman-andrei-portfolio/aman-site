<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="robots" content="noindex, nofollow"/>
<title>Comenzi · Aman</title>
<link rel="icon" href="/favicon.ico" sizes="48x48"/>
<link rel="icon" href="/assets/img/logo/favicon.svg" type="image/svg+xml"/>
<link rel="stylesheet" href="/assets/css/legal.css"/>
<style>
/* Panou de lucru: listă de carduri, statusul se schimbă cu un tap. Gândit întâi pentru telefon. */
main{padding-block:28px 64px}
.wrap{max-width:820px}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.top h1{margin:0}
.muted{color:var(--fg-2)}
.tabs{display:flex;gap:4px;padding:3px;background:#e8e8ed;border-radius:980px;width:max-content;max-width:100%;overflow-x:auto;margin-bottom:20px}
.tabs button{font:500 14px var(--sans);border:0;background:none;border-radius:980px;padding:7px 14px;cursor:pointer;color:var(--fg);white-space:nowrap}
.tabs button[aria-selected="true"]{background:#fff;box-shadow:0 1px 4px rgba(0,0,0,.12)}
.tabs b{font-weight:600;margin-left:4px;color:var(--fg-2)}
.list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.card{background:var(--bg-2);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.head h2{font-size:19px;margin:0;letter-spacing:-.02em}
.head .who{font-size:14px;color:var(--fg-2);margin-top:2px;word-break:break-word}
.price{font-weight:600;white-space:nowrap;font-variant-numeric:tabular-nums}
.st{display:flex;flex-wrap:wrap;gap:6px}
.st button{font:500 13px var(--sans);border:1px solid var(--line);background:#fff;color:var(--fg);border-radius:980px;padding:7px 12px;cursor:pointer}
.st button[aria-pressed="true"]{border-color:transparent;color:#fff}
.st button[data-s="requested"][aria-pressed="true"]{background:#6e6e73}
.st button[data-s="paid"][aria-pressed="true"]{background:#0071e3}
.st button[data-s="in_progress"][aria-pressed="true"]{background:#c76a00}
.st button[data-s="review"][aria-pressed="true"]{background:#7a3fc4}
.st button[data-s="delivered"][aria-pressed="true"]{background:#1a7f37}
.st button[data-s="cancelled"][aria-pressed="true"],.st button[data-s="refunded"][aria-pressed="true"]{background:#1d1d1f}
label{display:block;font-size:13px;font-weight:600;color:var(--fg-2);margin-bottom:4px}
textarea,input[type=url]{width:100%;font:400 15px var(--sans);color:var(--fg);background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}
textarea{min-height:64px;resize:vertical}
textarea:focus,input:focus{outline:2px solid #0071e3;outline-offset:1px;border-color:transparent}
.row{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;background:#0071e3;color:#fff;font:400 15px var(--sans);border:0;border-radius:980px;padding:9px 18px;cursor:pointer}
.btn:hover{background:#0077ed;text-decoration:none}
.btn[disabled]{opacity:.45;cursor:default}
.saved{font-size:13px;color:#1a7f37}
.err{font-size:13px;color:#c4001a}
.meta{font-size:12px;color:var(--fg-2)}
.empty,.box{background:var(--bg-2);border-radius:20px;padding:28px;text-align:center;color:var(--fg-2)}
.box .btn{margin-top:14px}
.help{font-size:14px;color:var(--fg-2);margin:0 0 18px}
.files{border-top:1px solid var(--line);padding-top:12px}
.flist{list-style:none;margin:0 0 10px;padding:0;display:flex;flex-direction:column;gap:6px}
.flist li{display:flex;align-items:center;gap:10px;background:#fff;border-radius:10px;padding:8px 12px;font-size:14px}
.flist li.meta{background:none;padding:0}
.flist a{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.x{font:500 13px var(--sans);color:#c4001a;background:none;border:0;cursor:pointer;padding:2px 4px}
.up{display:inline-flex;align-items:center;font:500 14px var(--sans);color:#0066cc;border:1px solid #0066cc;border-radius:980px;padding:7px 14px;cursor:pointer;margin:0}
.up input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.up:focus-within{outline:2px solid #0071e3;outline-offset:2px}
</style>
</head>
<body>
<header class="nav"><div class="wrap"><a class="brand" href="/">Aman</a><a href="/#cont">Contul meu</a></div></header>
<main class="wrap">
  <div class="top"><h1>Comenzi</h1><button type="button" class="btn" id="reload" hidden>Reîmprospătează</button></div>
  <p class="help" id="help" hidden>Apasă pe un status ca să-l schimbi. Clientul îl vede imediat în contul lui. Mesajul și linkul de livrare se salvează cu butonul „Salvează”.</p>
  <div id="app"><p class="muted">Se încarcă…</p></div>
</main>
<script src="/assets/js/admin.js" defer></script>
</body>
</html>
